# Render Blueprint — one-click backend deploy
# Docs: https://render.com/docs/blueprint-spec
# After pushing to GitHub, go to: https://dashboard.render.com/blueprints
# Select your repo, Render will read this file and create the service automatically.

services:
  - type: web
    name: eld-trip-planner-api
    runtime: python
    rootDir: eld_backend
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt && python manage.py migrate --noinput && python manage.py collectstatic --noinput
    startCommand: gunicorn eld_trip_planner_backend.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: ALLOWED_HOSTS
        value: localhost,127.0.0.1
      - key: CORS_ALLOWED_ORIGINS
        # Update this to your actual Vercel URL after frontend deploy
        value: https://eld-trip-planner.vercel.app,http://localhost:5173
    healthCheckPath: /api/health
    autoDeploy: true
